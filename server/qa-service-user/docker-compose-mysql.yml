version: '3.8'

services:
  healthcare_mysql:
    # 使用官方 mysql 镜像；如需 1ms 加速，建议在 Docker 守护进程中配置 registry mirror
    image: mysql:8.4
    container_name: asdm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: asdm#2026   # TODO: 本地开发可用，建议自行修改为更安全的密码
      MYSQL_DATABASE: healthcare_mysql # 初始化数据库名
      MYSQL_USER: root                 # 应用数据库用户
      MYSQL_PASSWORD: asdm#2026        # 应用用户密码
      TZ: Asia/Shanghai
    command:
      - mysqld
      # 设置为 utf8mb4 以避免中文乱码
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - 19306:3306
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init-sqls:/docker-entrypoint-initdb.d  # init sqls, will execute when first start
      - ./mysql/sqls:/home/mysql/sqls  # all database sqls
      - ./mysql/backup:/home/mysql/backup # default backup dir
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pasdm#2026"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
